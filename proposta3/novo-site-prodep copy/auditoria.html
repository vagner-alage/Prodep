/* ============================================================
   RENDER
   ============================================================ */
const app = document.getElementById("app");
const buscaEl = document.getElementById("busca");
const contagemEl = document.getElementById("contagem");
const botoesFiltro = document.querySelectorAll(".filtros button");

let filtroAtual = "todos";
let termoBusca = "";

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderPath(path) {
  if (path === "REMOVIDO") {
    return `<span class="path"><strong>REMOVIDO</strong></span>`;
  }
  const partes = path.split(" > ").map(escapeHtml);
  return `<span class="path">${partes.join('<span class="sep">›</span>')}</span>`;
}

function itemBateFiltro(item) {
  if (filtroAtual === "ativos" && item.removido) return false;
  if (filtroAtual === "removidos" && !item.removido) return false;
  return true;
}

function itemBateBusca(item) {
  if (!termoBusca) return true;
  const t = termoBusca.toLowerCase();
  const haystack = [
    String(item.num),
    item.nome,
    item.path,
    item.url,
    item.obs.join(" ")
  ].join(" ").toLowerCase();
  return haystack.includes(t);
}

function render() {
  const visiveis = ITENS.filter(i => itemBateFiltro(i) && itemBateBusca(i));

  if (visiveis.length === 0) {
    app.innerHTML = `<div class="vazio">Nenhum item encontrado.</div>`;
    contagemEl.textContent = `0 de ${ITENS.length}`;
    return;
  }

  app.innerHTML = visiveis.map(item => {
    const cls = item.removido ? "item removido" : "item";
    const badge = item.removido
      ? `<span class="badge removido">Removido</span>`
      : `<span class="badge ok">Ativo</span>`;

    const urlHtml = item.url
      ? `<div class="url">🔗 <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.url)}</a></div>`
      : "";

    const obsHtml = item.obs.length
      ? item.obs.map(o => `<div class="obs">${escapeHtml(o)}</div>`).join("")
      : "";

    return `
      <article class="${cls}" id="item-${item.num}">
        <div class="linha1">
          <span class="num"># ${item.num}</span>
          <span class="nome">${escapeHtml(item.nome)}</span>
          ${badge}
        </div>
        <div>${renderPath(item.path)}</div>
        ${urlHtml}
        ${obsHtml}
      </article>
    `;
  }).join("");

  const ativos = ITENS.filter(i => !i.removido).length;
  const removidos = ITENS.filter(i => i.removido).length;
  contagemEl.textContent = `${visiveis.length} de ${ITENS.length} · ${ativos} ativos · ${removidos} removidos`;
}

/* ============================================================
   EVENTOS
   ============================================================ */
buscaEl.addEventListener("input", () => {
  termoBusca = buscaEl.value.trim();
  render();
});

botoesFiltro.forEach(btn => {
  btn.addEventListener("click", () => {
    botoesFiltro.forEach(b => b.classList.remove("ativo"));
    btn.classList.add("ativo");
    filtroAtual = btn.dataset.filtro;
    render();
  });
});

render();
</script>
