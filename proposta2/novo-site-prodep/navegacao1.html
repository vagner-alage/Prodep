<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Protótipo PRODEP — Navegação a partir da Página Inicial</title>
<style>
  :root {
    --verde: #2e7d32;
    --amarelo: #f9a825;
    --vermelho: #c62828;
    --cinza: #f0f0f0;
    --borda: #ccc;
    --texto: #222;
    --azul: #1565c0;
    --azul-claro: #e3f2fd;
  }

  * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

  body { margin: 0; background: #fafafa; color: var(--texto); }

  /* ===== CABEÇALHO DO TESTE ===== */
  .barra-teste {
    background: #fff3cd;
    border-bottom: 2px solid #ffc107;
    padding: 0.6rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 200;
    font-size: 0.9rem;
  }
  .barra-teste .alvo { font-weight: 700; color: #856404; }
  .barra-teste .progresso { color: #555; }

  /* ===== HEADER DO SITE ===== */
  header.site {
    background: #fff;
    border-bottom: 1px solid var(--borda);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  header.site .logo {
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: 0.5px;
  }
  header.site nav.menu {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  header.site nav.menu button {
    background: transparent;
    border: 1px solid var(--borda);
    padding: 0.4rem 0.9rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  header.site nav.menu button:hover { background: var(--azul-claro); }

  /* ===== CONTEÚDO ===== */
  main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

  .secao { margin-bottom: 2.2rem; }
  .secao h2 {
    font-size: 1.15rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #333;
    margin: 0 0 0.8rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .secao h2 .link-mais {
    font-size: 0.8rem;
    color: var(--azul);
    cursor: pointer;
    font-weight: 500;
    text-transform: none;
  }

  /* Carrossel */
  .carrossel {
    background: #e0e0e0;
    border-radius: 8px;
    height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #555;
    font-size: 0.95rem;
    border: 1px dashed #bbb;
  }
  .carrossel strong { font-size: 1.1rem; color: #333; }

  /* Avisos */
  .avisos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; }
  .aviso {
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 6px;
    padding: 1rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .aviso:hover { border-color: var(--azul); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .aviso .tema { font-size: 0.75rem; text-transform: uppercase; color: #888; }
  .aviso .titulo { font-weight: 600; margin: 0.3rem 0; }
  .aviso .ler { font-size: 0.8rem; color: var(--azul); }

  /* Notícias */
  .noticias { display: grid; grid-template-columns: 1fr 2fr; gap: 0.8rem; }
  .card-noticia {
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 6px;
    padding: 1rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .card-noticia:hover { border-color: var(--azul); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .card-noticia.destaque { background: #f5f5f5; }
  .card-noticia .titulo { font-weight: 600; margin-bottom: 0.4rem; }

  /* Categorias */
  .categorias { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip {
    background: #fff;
    border: 1px solid var(--borda);
    padding: 0.45rem 1rem;
    border-radius: 20px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .chip:hover { background: var(--azul-claro); border-color: var(--azul); }

  /* Grids de Serviços / Acesso à Informação / Utilidades */
  .grid-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
  }
  .card-grupo {
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 6px;
    padding: 1rem;
    text-align: center;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .card-grupo:hover { background: var(--azul-claro); border-color: var(--azul); }

  .grid-utilidades { grid-template-columns: repeat(2, 1fr); }

  /* Rodapé */
  footer.site {
    background: #f5f5f5;
    border-top: 1px solid var(--borda);
    padding: 1.2rem 2rem;
    text-align: center;
    font-size: 0.85rem;
    color: #666;
  }
  footer.site a { color: var(--azul); cursor: pointer; text-decoration: none; margin: 0 0.5rem; }

  /* ===== PÁGINAS INTERNAS ===== */
  .breadcrumb {
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 1rem;
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .breadcrumb span.crumb { cursor: pointer; color: var(--azul); }
  .breadcrumb span.crumb:hover { text-decoration: underline; }
  .breadcrumb span.sep { color: #aaa; }

  .pagina-grupo h2.titulo { font-size: 1.5rem; margin: 0 0 1rem; }
  .pagina-grupo .subgrupo { margin-bottom: 1.5rem; }
  .pagina-grupo .subgrupo h3 {
    font-size: 1.05rem;
    color: #444;
    border-bottom: 1px solid #eee;
    padding-bottom: 0.3rem;
    margin-bottom: 0.6rem;
  }
  .pagina-grupo .itens { display: flex; flex-wrap: wrap; gap: 0.5rem; }

  .item {
    background: #fff;
    border: 1px solid var(--borda);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
    user-select: none;
    font-size: 0.9rem;
  }
  .item:hover { background: var(--azul-claro); border-color: var(--azul); }
  .item.acerto { background: var(--verde) !important; color: #fff !important; border-color: var(--verde) !important; }
  .item.erro { background: var(--amarelo) !important; color: #222 !important; border-color: var(--amarelo) !important; }
  .item.falha { background: var(--vermelho) !important; color: #fff !important; border-color: var(--vermelho) !important; }

  .btn-voltar {
    background: var(--cinza);
    border: 1px solid var(--borda);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    margin-bottom: 1rem;
  }
  .btn-voltar:hover { background: var(--azul-claro); }

  /* Resultado final */
  .resultado-final {
    background: #fff;
    border: 2px solid var(--azul);
    padding: 1.5rem;
    border-radius: 8px;
    margin-top: 2rem;
  }
  .resultado-final h2 { margin-top: 0; }
  .resultado-final ul { list-style: none; padding: 0; }
  .resultado-final li {
    padding: 0.3rem 0;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
  }
  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
  }
  .badge.verde { background: var(--verde); }
  .badge.amarelo { background: var(--amarelo); color: #222; }
  .badge.vermelho { background: var(--vermelho); }

  .btn-reiniciar {
    background: var(--azul);
    color: #fff;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    margin-top: 1rem;
  }

  @media (max-width: 800px) {
    .avisos { grid-template-columns: 1fr; }
    .noticias { grid-template-columns: 1fr; }
    .grid-cards { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>

  },
  "Notícias e avisos": {
    "Notícias": [32, 88],
    "Comunicados e avisos": [85, 86, 87],
    "Editais e resultados": [83, 84]
  },
  "Utilidades": {
    "Navegação": [13],
    "Busca": [80]
  }
};

/* ============================================================
   3. ESTADO
   ============================================================ */
const STORAGE_KEY = "prodep_teste_home";
let estado = { indiceAtual: 0, resultados: {}, tentativas: {} };

function carregarEstado() {
  const salvo = localStorage.getItem(STORAGE_KEY);
  if (salvo) {
    try {
      const p = JSON.parse(salvo);
      if (p && typeof p === "object") estado = { ...estado, ...p };
    } catch (e) { console.warn(e); }
  }
}
function salvarEstado() { localStorage.setItem(STORAGE_KEY, JSON.stringify(estado)); }

/* ============================================================
   4. DOM
   ============================================================ */
const app = document.getElementById("app");
const itemAtualEl = document.getElementById("itemAtual");
const progressoEl = document.getElementById("progresso");

/* ============================================================
   5. RENDER: PÁGINA INICIAL (wireframe)
   ============================================================ */
function renderHome() {
  app.innerHTML = `
    <section class="secao">
      <div class="carrossel">
        <strong>Destaque principal</strong>
        <span>Chamada + acesso ao conteúdo</span>
      </div>
    </section>

    <section class="secao">
      <h2>Avisos</h2>
      <div class="avisos">
        <div class="aviso" data-grupo="Notícias e avisos">
          <div class="tema">Tema</div>
          <div class="titulo">Comunicado 24/2026 — progressão</div>
          <div class="ler">Ler aviso →</div>
        </div>
        <div class="aviso" data-grupo="Notícias e avisos">
          <div class="tema">Tema</div>
          <div class="titulo">Reconvocação para prova de vida</div>
          <div class="ler">Ler aviso →</div>
        </div>
        <div class="aviso" data-grupo="Notícias e avisos">
          <div class="tema">Tema</div>
          <div class="titulo">Comunicado 23/2026 — planos de saúde</div>
          <div class="ler">Ler aviso →</div>
        </div>
      </div>
    </section>

    <section class="secao">
      <h2>Notícias e avisos <span class="link-mais" data-grupo="Notícias e avisos">Todas as notícias →</span></h2>
      <div class="noticias">
        <div class="card-noticia destaque" data-grupo="Notícias e avisos">
          <div class="titulo">Card fixo - notícia destaque</div>
          <div class="ler">Ler notícia →</div>
        </div>
        <div class="card-noticia" data-grupo="Notícias e avisos">
          <div class="titulo">Notícia principal</div>
          <div class="ler">Ler notícia →</div>
        </div>
      </div>
    </section>

    <section class="secao">
      <h2>Categorias · Perfis</h2>
      <div class="categorias">
        <div class="chip">Ativo</div>
        <div class="chip">Aposentado</div>
        <div class="chip">Pensionista</div>
        <div class="chip">Comissionado</div>
        <div class="chip">Substituto</div>
        <div class="chip">Visitante</div>
        <div class="chip">Bolsista</div>
      </div>
    </section>

    <section class="secao">
      <h2>Serviços <span class="link-mais" data-grupo="Serviços">Todos os serviços →</span></h2>
      <div class="grid-cards">
        ${Object.keys(ESTRUTURA["Serviços"]).map(sg =>
          `<div class="card-grupo" data-grupo="Serviços" data-subgrupo="${sg}">${sg}</div>`
        ).join("")}
      </div>
    </section>

    <section class="secao">
      <h2>Acesso à Informação <span class="link-mais" data-grupo="Acesso à informação">Todas as informações →</span></h2>
      <div class="grid-cards">
        ${Object.keys(ESTRUTURA["Acesso à informação"]).map(sg =>
          `<div class="card-grupo" data-grupo="Acesso à informação" data-subgrupo="${sg}">${sg}</div>`
        ).join("")}
      </div>
    </section>

    <section class="secao">
      <h2>Utilidades</h2>
      <div class="grid-cards grid-utilidades">
        ${Object.keys(ESTRUTURA["Utilidades"]).map(sg =>
          `<div class="card-grupo" data-grupo="Utilidades" data-subgrupo="${sg}">${sg === "Navegação" ? "Mapa do Site" : "Palavras-Chave"}</div>`
        ).join("")}
      </div>
    </section>
  `;
  bindEventosHome();
}

function bindEventosHome() {
  // Cards que abrem grupos diretamente
  document.querySelectorAll("[data-grupo]").forEach(el => {
    el.addEventListener("click", () => {
      const g = el.dataset.grupo;
      const sg = el.dataset.subgrupo;
      if (sg) renderGrupo(g, sg);
      else renderGrupo(g);
    });
  });

  // Botões do header
  document.querySelectorAll("header.site nav.menu button").forEach(btn => {
    btn.addEventListener("click", () => {
      const g = btn.dataset.grupo;
      if (g) renderGrupo(g);
    });
  });

  // Rodapé
  document.querySelectorAll("footer.site a").forEach(a => {
    a.addEventListener("click", () => {
      const t = a.textContent.trim();
      if (t === "Mapa do site") renderGrupo("Utilidades", "Navegação");
      if (t === "Busca/Palavras-Chave") renderGrupo("Utilidades", "Busca");
    });
  });
}

/* ============================================================
   6. RENDER: PÁGINA DE GRUPO / SUBGRUPO
   ============================================================ */
function renderGrupo(grupo, subgrupoFoco = null) {
  const subgrupos = ESTRUTURA[grupo];
  if (!subgrupos) return;

  let html = `
    <div class="breadcrumb">
      <span class="crumb" data-voltar-home>Início</span>
      <span class="sep">›</span>
      <span>${grupo}</span>
      ${subgrupoFoco ? `<span class="sep">›</span><span>${subgrupoFoco}</span>` : ""}
    </div>
    <button class="btn-voltar" data-voltar-home>← Voltar para a Página Inicial</button>
    <div class="pagina-grupo">
      <h2 class="titulo">${grupo}</h2>
  `;

  const chaves = subgrupoFoco ? [subgrupoFoco] : Object.keys(subgrupos);

  chaves.forEach(sg => {
    const ids = subgrupos[sg];
    if (!ids) return;
    html += `
      <div class="subgrupo">
        <h3>${sg}</h3>
        <div class="itens">
          ${ids.map(id => {
            const item = ITENS.find(i => i.id === id);
            if (!item) return "";
            const r = estado.resultados[id];
            let cls = "item";
            if (r === "verde") cls += " acerto";
            if (r === "amarelo") cls += " erro";
            if (r === "vermelho") cls += " falha";
            return `<div class="${cls}" data-id="${id}">${item.nome}</div>`;
          }).join("")}
        </div>
      </div>
    `;
  });

  html += `</div>`;
  app.innerHTML = html;

  // Eventos
  document.querySelectorAll("[data-voltar-home]").forEach(el => {
    el.addEventListener("click", renderHome);
  });

  document.querySelectorAll(".item").forEach(el => {
    el.addEventListener("click", () => clicarItem(parseInt(el.dataset.id, 10), el));
  });
}

/* ============================================================
   7. LÓGICA DO TESTE
   ============================================================ */
function clicarItem(id, el) {
  const itemAtual = ITENS[estado.indiceAtual];
  if (!itemAtual) return;

  if (id === itemAtual.id) {
    el.classList.remove("erro", "falha");
    el.classList.add("acerto");
    estado.resultados[id] = "verde";
    estado.tentativas[id] = 0;
    salvarEstado();
    avancar();
    return;
  }

  if (!estado.tentativas[id]) estado.tentativas[id] = 0;
  estado.tentativas[id] += 1;

  el.classList.remove("acerto", "falha");
  el.classList.add("erro");
  setTimeout(() => {
    if (estado.resultados[id] !== "verde") el.classList.remove("erro");
  }, 800);

  if (estado.tentativas[itemAtual.id] >= 3) {
    estado.resultados[itemAtual.id] = "vermelho";
    salvarEstado();
    avancar();
  }
}

function avancar() {
  estado.indiceAtual += 1;
  salvarEstado();
  renderItemAtual();
  if (estado.indiceAtual >= ITENS.length) {
    //renderResultadoFinal();
  } else {
    renderHome(); // volta para a home a cada novo item
  }
}

function renderItemAtual() {
  const item = ITENS[estado.indiceAtual];
  if (!item) {
    itemAtualEl.textContent = "🏁 Teste concluído!";
    progressoEl.textContent = `${Object.keys(estado.resultados).length} / ${ITENS.length}`;
    return;
  }
  itemAtualEl.textContent = item.nome;
  progressoEl.textContent = `${estado.indiceAtual + 1} / ${ITENS.length}`;
}

/* ============================================================
   8. RESULTADO FINAL
   ============================================================ */
function renderResultadoFinal() {
  let html = `<div class="resultado-final"><h2>Resultado Final</h2><ul>`;
  ITENS.forEach(item => {
    const r = estado.resultados[item.id];
    let badge = '<span class="badge">—</span>';
    if (r === "verde") badge = '<span class="badge verde">Fácil</span>';
    else if (r === "amarelo") badge = '<span class="badge amarelo">Médio</span>';
    else if (r === "vermelho") badge = '<span class="badge vermelho">Não encontrado</span>';
    html += `<li><span>${item.nome}</span> ${badge}</li>`;
  });
  html += `</ul><button class="btn-reiniciar" onclick="reiniciarTeste()">Reiniciar Teste</button></div>`;
  app.innerHTML = html;
  itemAtualEl.textContent = "🏁 Teste concluído!";
}

function reiniciarTeste() {
  localStorage.removeItem(STORAGE_KEY);
  estado = { indiceAtual: 0, resultados: {}, tentativas: {} };
  renderItemAtual();
  renderHome();
}

/* ============================================================
   9. INIT
   ============================================================ */
function init() {
  carregarEstado();
  renderItemAtual();
  renderHome();
}
init();
</script>
</body>
</html>
